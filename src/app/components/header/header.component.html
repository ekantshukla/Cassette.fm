<header>
  <div class="wrap bar">
    <div class="logo">Cassette<i>.fm</i></div>

    <app-search-box class="search" />

    <div class="right">
      <app-language-picker />
      <button class="gear" type="button" aria-label="Settings" aria-controls="settings-panel"
              [attr.aria-expanded]="settings.open()" (click)="settings.openAt()">
        <app-icon name="settings" />
      </button>
      @if (account.user(); as user) {
        <button class="profile" type="button" [attr.aria-label]="'Your profile: ' + account.displayName()" (click)="settings.openAt('account')">
          @if (account.avatar(); as photo) {
            <img class="pic" [src]="photo" alt="" referrerpolicy="no-referrer">
          } @else {
            <span class="pic initials">{{ account.initials() }}</span>
          }
          <span class="name">{{ firstName() }}</span>
        </button>
      } @else if (account.ready()) {
        <button class="login" type="button" aria-label="Log in or create an account" title="Log in" (click)="account.screenOpen.set(true)">
          <app-icon name="user" />
        </button>
      }
      <div class="live" [class.on]="player.isPlaying()">
        <b></b><span>{{ liveText() }}</span>
      </div>
      <button class="menu-btn" type="button" aria-label="Open playlists menu" aria-controls="drawer"
              [attr.aria-expanded]="menuOpen()" (click)="menuClick.emit()">
        <app-icon name="menu" />
      </button>
    </div>
  </div>
</header>
