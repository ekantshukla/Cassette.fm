# Builds the Android app (APK) and publishes it as a GitHub Release.
# Runs when the app's code changes on main, and on demand (Actions tab -> "Build Android app" -> Run workflow).
#
# The newest app is always at:
#   https://github.com/<you>/<repo>/releases/latest/download/Cassette.fm.apk
#
# One-time setup: add the 4 signing secrets (see ANDROID.md). Without them the workflow still
# builds a test APK, but phones can't update it in place later.
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # to publish the release

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Point the app at this repo and version
        run: |
          sed -i "s|^export const GITHUB_REPO = .*|export const GITHUB_REPO = '${{ github.repository }}';|" src/app/data/app-info.ts
          sed -i "s|^export const APP_VERSION = .*|export const APP_VERSION = '${VERSION_NAME}';|" src/app/data/app-info.ts

      # Accounts (sign up / log in). Needs the GOOGLE_SERVICES_JSON secret — see ACCOUNTS.md.
      # Without it the app is built without accounts (everything else works).
      - name: Accounts (Firebase)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            sed -i "s|^export const ACCOUNTS_ENABLED = .*|export const ACCOUNTS_ENABLED = true;|" src/app/data/app-info.ts
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set: building without accounts. See ACCOUNTS.md."
            npm uninstall --no-save @capacitor-firebase/authentication @capacitor-firebase/firestore
          fi

      # Bundle the website's ready-made playlists, so playlists open even offline.
      # (The app also fetches the newest ones from the website when online.)
      - name: Copy playlists from the website
        continue-on-error: true
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/playlists.json" -o public/playlists.json

      - run: npm run build
      - run: npx cap sync android

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set: building a debug APK. See ANDROID.md."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Cassette.fm.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Cassette.fm.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Cassette.fm-${{ env.VERSION_NAME }}
          path: Cassette.fm.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Cassette.fm ${{ env.VERSION_NAME }}
          make_latest: true
          files: Cassette.fm.apk
          body: |
            📱 **Install:** open this page on your Android phone, tap **Cassette.fm.apk**, then **Install**.
            If Android asks, allow installing apps from your browser ("Install unknown apps").

            Already have the app? Installing this updates it — your downloads and liked songs stay.
